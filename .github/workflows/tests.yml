name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax checks
        run: bash -n scripts/*.sh docker/entrypoint.sh
